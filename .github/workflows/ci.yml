name: CI

# Every pull request, and master once something lands on it.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The integration ships its icons in brand/ (Home Assistant 2026.3
          # and later) instead of in the home-assistant/brands repo.
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: wimpysworld/nothing-but-nix@v12
        with:
          hatchet-protocol: "rampage"
          witness-carnage: true
          nix-permission-edict: true

      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, and
      # single-user Nix needs them for the build sandbox.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: nixbuild/nix-quick-install-action@v35

      - name: Lint
        run: nix develop -c bash -c 'ruff check . && ruff format --check .'

      - name: Cards bundle is up to date
        run: nix develop -c node scripts/build.js --check

      # Unit coverage of the cards is reported, not enforced: the end-to-end
      # tests, which it cannot see, cover their interactions.
      - name: Card tests
        shell: bash
        run: |
          nix develop -c node --experimental-vm-modules --experimental-test-coverage \
            --test-coverage-include='src/**' --test 'tests/cards/*.test.js' | tee card-tests.txt
          {
            echo "### Card unit test coverage"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' card-tests.txt \
              | sed 's/^ℹ //' | cut -d'|' -f1-4
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Integration tests
        run: nix develop -c pytest --cov

      - name: Integration test coverage
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        shell: bash
        run: |
          {
            echo "### Integration test coverage"
            nix develop -c coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end tests
        run: nix develop -c scripts/e2e
