name: CI

# Every pull request, and master once something lands on it.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: wimpysworld/nothing-but-nix@v12
        with:
          hatchet-protocol: "rampage"
          witness-carnage: true
          nix-permission-edict: true

      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, and
      # single-user Nix needs them for the build sandbox.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: nixbuild/nix-quick-install-action@v35

      - name: Lint
        run: nix develop -c bash -c 'ruff check . && ruff format --check .'

      - name: Cards bundle is up to date
        run: nix develop -c node scripts/build.js --check

      # The cards' coverage is that of these unit tests and the end-to-end
      # tests together, which cover their interactions: see "Card coverage".
      - name: Card tests
        shell: bash
        run: |
          nix develop -c node --experimental-vm-modules --experimental-test-coverage \
            --test-coverage-include='src/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=card-unit.lcov \
            --test 'tests/cards/*.test.js' | tee card-tests.txt
          {
            echo "### Card unit test coverage"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' card-tests.txt \
              | sed 's/^ℹ //' | cut -d'|' -f1-4
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Integration tests
        run: nix develop -c pytest --cov

      - name: Integration test coverage
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        shell: bash
        run: |
          {
            echo "### Integration test coverage"
            nix develop -c coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end tests
        run: nix develop -c scripts/e2e
        env:
          METRON_CARD_COVERAGE: card-e2e

      - name: Card coverage
        if: ${{ !cancelled() && hashFiles('card-unit.lcov') != '' }}
        shell: bash
        run: |
          nix develop -c node scripts/card-coverage.js card-e2e card-unit.lcov --fail-under 90 \
            | tee card-coverage.txt
          {
            echo "### Card coverage, unit and end-to-end tests together"
            echo '```'
            cat card-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The end-to-end tests again, inside NixOS VMs with no network, built from
  # uv.lock: one VM, and one job, per database. The Android VM test is left
  # out: it needs nested KVM, which the runners, themselves VMs, run far too
  # slowly.
  e2e-vm:
    name: e2e-vm (${{ matrix.database }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: wimpysworld/nothing-but-nix@v12
        with:
          hatchet-protocol: "rampage"
          witness-carnage: true
          nix-permission-edict: true

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The runner has /dev/kvm, but only root may open it.
      - name: Open /dev/kvm to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: End-to-end tests in a VM
        run: nix build -L .#checks.x86_64-linux.e2e-vm-${{ matrix.database }}
