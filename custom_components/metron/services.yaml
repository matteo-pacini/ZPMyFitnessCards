log_weight:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: metron
    weight:
      required: true
      example: 68.4
      selector:
        number:
          step: 0.1
          mode: box
    unit:
      selector:
        select:
          options:
            - kg
            - lb
    day:
      selector:
        date:

log_food:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: metron
    meal:
      required: true
      selector:
        select:
          options:
            - breakfast
            - lunch
            - dinner
            - snacks
          translation_key: meal
    day:
      selector:
        date:
    food:
      example: Porridge oats
      selector:
        text:
    barcode:
      example: "5000168001142"
      selector:
        text:
    grams:
      example: 60
      selector:
        number:
          min: 0
          step: any
          unit_of_measurement: g
          mode: box
    name:
      example: Restaurant pizza
      selector:
        text:
    kcal:
      example: 900
      selector:
        number:
          min: 0
          step: any
          unit_of_measurement: kcal
          mode: box
    protein:
      selector:
        number:
          min: 0
          step: any
          unit_of_measurement: g
          mode: box
    carbs:
      selector:
        number:
          min: 0
          step: any
          unit_of_measurement: g
          mode: box
    fat:
      selector:
        number:
          min: 0
          step: any
          unit_of_measurement: g
          mode: box

log_meal:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: metron
    saved_meal:
      required: true
      example: Usual breakfast
      selector:
        text:
    meal:
      required: true
      selector:
        select:
          options:
            - breakfast
            - lunch
            - dinner
            - snacks
          translation_key: meal
    day:
      selector:
        date:

get_day:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: metron
    day:
      selector:
        date:
