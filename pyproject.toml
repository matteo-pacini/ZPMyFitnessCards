[project]
name = "metron"
version = "0.5.1"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.375",
  "playwright==1.64.1",
  # The Postgres driver SQLAlchemy uses by default. Home Assistant installs
  # that run their recorder on Postgres already have it.
  "psycopg2-binary==2.9.13",
  # The frontend release Home Assistant 2026.10.4 pins, for the end-to-end tests.
  "home-assistant-frontend==20260930.5",
  # What the integrations a new Home Assistant 2026.10.4 always loads need,
  # pinned as in their manifests. The end-to-end tests start Home Assistant
  # with --skip-pip, and its frontend stalls while any of these is missing.
  "PyMetno==0.13.0",
  "PyTurboJPEG==1.8.3",
  "gTTS==2.5.4",
  "gazetteer-matcher==1.1.0",
  "ha-ffmpeg==3.2.2",
  "hassil==3.12.1",
  "home-assistant-intents==2026.10.6",
  "infrared-protocols==10.1.0",
  "mutagen==1.48.1",
  "pycountry==24.6.1",
  "pymicro-vad==1.0.1",
  "pyspeex-noise==1.0.2",
  "radios==1.0.0",
  "rf-protocols==4.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/integration"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may check files directly; blocking the event loop there harms nothing.
"tests/**" = ["ASYNC240"]

# CI runs pytest --cov, which fails below this floor, so a change that
# leaves much of its code untested stands out.
[tool.coverage.run]
source = ["custom_components/metron"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
